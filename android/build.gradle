plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.wallpaper'
version = '0.3.0'

android {
  namespace "expo.modules.wallpaper"
  defaultConfig {
    versionCode 1
    versionName "0.3.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.media3:media3-exoplayer:1.11.1"
  implementation "androidx.media3:media3-effect:1.11.1"
}
